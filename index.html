<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f1117;
    color: #e8e8e8;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    background: #171a23;
    border-bottom: 1px solid #2a2e3a;
    font-size: 18px;
    font-weight: 600;
    color: #4fc3f7;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #4fc3f7;
    color: #0f1117;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: #1f2330;
    border-bottom-left-radius: 4px;
  }
  #inputArea {
    display: flex;
    padding: 14px;
    background: #171a23;
    border-top: 1px solid #2a2e3a;
    gap: 10px;
  }
  #textInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 20px;
    border: none;
    background: #1f2330;
    color: #e8e8e8;
    font-size: 15px;
    outline: none;
  }
  button {
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    background: #4fc3f7;
    color: #0f1117;
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
  }
  button:active { opacity: 0.8; }
  #micBtn {
    background: #2a2e3a;
    color: #e8e8e8;
    padding: 0 14px;
  }
  #micBtn.listening {
    background: #ff5252;
    color: white;
  }
</style>
</head>
<body>

<header>🤖 Jarvis</header>
<div id="chat"></div>

<div id="inputArea">
  <button id="micBtn" onclick="toggleMic()">🎤</button>
  <input type="text" id="textInput" placeholder="Kuch bhi pucho..." onkeypress="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Bhejo</button>
</div>

<script>
const chatBox = document.getElementById("chat");
const textInput = document.getElementById("textInput");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
  const message = textInput.value.trim();
  if (!message) return;
  addMessage(message, "user");
  textInput.value = "";

  addMessage("...", "bot");
  const thinkingMsg = chatBox.lastChild;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message })
    });
    const data = await res.json();
    thinkingMsg.textContent = data.reply;
    speak(data.reply);
  } catch (e) {
    thinkingMsg.textContent = "Error: server se connect nahi ho paya";
  }
}

function speak(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "hi-IN";
  window.speechSynthesis.speak(utterance);
}

// Voice input using browser's built-in speech recognition
let recognition;
let listening = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    textInput.value = transcript;
    sendMessage();
  };

  recognition.onend = () => {
    listening = false;
    document.getElementById("micBtn").classList.remove("listening");
  };
}

function toggleMic() {
  if (!recognition) {
    alert("Ye browser voice input support nahi karta. Chrome use karo.");
    return;
  }
  if (listening) {
    recognition.stop();
  } else {
    recognition.start();
    listening = true;
    document.getElementById("micBtn").classList.add("listening");
  }
}

addMessage("Namaste! Main Jarvis hoon. Type karo ya mic dabao.", "bot");
</script>

</body>
</html>
